[project]
name = "ndr-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3",
  "joblib>=1.4,<2",
  "lightgbm>=4.7.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[project.scripts]
ndr = "ndr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ndr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
